name: Build JBBT CLIENT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip -q JBBT_CLIENT_ANDROID_PROJECT.zip -d project
          PROJECT_DIR="$(dirname "$(find project -type f -name settings.gradle -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" JBBT_CLIENT-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JBBT-CLIENT-APK
          path: JBBT_CLIENT-debug.apk
